name: student_attendance_app
description: Student Attendance — check in with a short-lived 6-digit code.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1      # state management (§4)
  dio: ^5.4.3                   # HTTP (§4)
  go_router: ^14.2.0            # navigation (§4)
  flutter_secure_storage: ^9.2.2 # token storage (§4/§16)
  intl: ^0.19.0                 # dates/times (§4)
  connectivity_plus: ^6.0.3     # network status (§4)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
